name = "Camera1"                  # This device's name in the RoveComm manifest
ip = "192.168.100.10"             # Output ip
auto_restart = 5                  # Automatically restart this many seconds after the last restart
binary_path = "/bin/gst-launch"
picture_path = "/bin/fswebcam"
picture_dir = "/home/pi/pictures" # Picture output directory
# Arguments for the camera streaming binary
# Substitutions:
# $index: camera index
# $input: input device file
# $ip: output ip
# $port: output port
# $now: ISO 8601
binary_arguments = [
    "v4l2src",
    "device=$input !",
    "'video/x-raw-yuv,width=800,height=600'",
    "nvvidconv",
    "!",
    "nvv4l2h264enc",
    "!",
    "h264parse",
    "!",
    "udpsink host=$ip port=$port",
]
# Substitutions:
# $index: camera index
# $input: input device file
# $output: output file without extension
# $position: formatted lat, lon, alt, heading, and accuracies
# $now: ISO 8601
picture_arguments = [
    "--verbose",
    "--device",
    "$input",
    "--palette",
    "YUYV",
    "--resolution",
    "2560x1440",
    "--png",
    "0",
    "--no-timestamp",
    "--font",
    "sans:20",
    "--title",
    "$position",
    "$output.png",
]

# binary_arguments and picture_arguments can be overriden in [[device]]
# [[device]]
# id = Related to usb port, corresponds to id in parentheses in `v4l2-ctl --list-devices` e.g., "usb-xhci-hcd.0-2"
# port = Output port, e.g., 8100
